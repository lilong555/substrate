name: Snapshot fidelity validation

on:
  push:
    branches: [ci/snapshot-fidelity-20261121]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '4'
      GOMEMLIMIT: 4GiB
      REQUIRE_DOCKER: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: true
      - name: Validate pinned source
        run: bash .github/snapshot-fidelity/validate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: snapshot-fidelity-evidence
          path: _artifacts/
          if-no-files-found: error
