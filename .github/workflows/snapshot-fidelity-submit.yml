name: Snapshot fidelity submission checks

on:
  push:
    branches: [ci/snapshot-fidelity-submit-20261121]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        check: [race, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '4'
      GOMEMLIMIT: 4GiB
      REQUIRE_DOCKER: 'true'
      SOURCE_REVISION: ac0924a8cbbbb62ff1657cd1672f9cc3553bb459
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: true
      - uses: actions/setup-python@a3090ff319e9e9d264dba458525e58b543b56d62
        with:
          python-version: '3.12'
      - name: Validate submitted source
        run: bash .github/snapshot-fidelity/submit.sh "${{ matrix.check }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: snapshot-fidelity-${{ matrix.check }}
          path: _artifacts/
          if-no-files-found: error
